											</svg>
										</a>
									</li>
									<li v-if="speaker.mastodonHandle">
										<a :href="speaker.mastodonHandle" rel="nofollow" target="_blank"
											:ref="`mastodon ${speaker.firstName} ${speaker.lastName}`"
											:aria-label="`Mastodon profile of ${speaker.firstName} ${speaker.lastName}`"
											v-on:keydown.tab.prevent="focusTrapModal($event)">
											<svg class="icon" aria-hidden="true">
												<use xlink:href="images/icons/sprite.svg#mastodon"></use>
											</svg>
										</a>
									</li>
									<li v-if="speaker.blueskyHandle">
										<a :href="speaker.blueskyHandle" rel="nofollow" target="_blank"
											:ref="`bluesky ${speaker.firstName} ${speaker.lastName}`"
											:aria-label="`Bluesky profile of ${speaker.firstName} ${speaker.lastName}`"
											v-on:keydown.tab.prevent="focusTrapModal($event)">
											<svg class="icon" aria-hidden="true">
												<use xlink:href="images/icons/sprite.svg#bluesky"></use>
											</svg>
										</a>
									</li>
								</ul>
							</article>
						</div>
					</div>
				</div>
			</div>
		</section>

		<section class="alternate">
			<div class="wrap">
				<div class="box">
					<h2 class="section-heading section-heading--cube-10">
						<span>Expert Corner Sessions</span>
					</h2>
					<ol class="agenda">
						<li v-for="(slot, index) in this.expertCornerLineup" :key="index" v-cloak class="agenda-slot">
							<div class="agenda-slot-header">
								<div>
									<p class="agenda-slot-details">
										<span class="agenda-time">
											{{slot[0].startTime| trimTime}} {{slot[0].endTime | trimTime}}
										</span>

										<span class="agenda-room experts">
											{{slot[0].location | formatLocation}}
										</span>
									</p>
								</div>
							</div>
							<div class="agenda-slot-container">
								<ul class="agenda-slot-experts">
									<li v-for="event in slot" :key="event.id">
										<p>{{event.title | trimExpertText}}</p>
									</li>
								</ul>

							</div>

						</li>
					</ol>
				</div>
			</div>

		</section>
	</main>

	<footer id="footer">
		<footer-section></footer-section>
	</footer>

	<script src="./js/luxon.min.js"></script>

	<script src="./components/nav-section.component.js"></script>
	<script src="./components/nav-section-mobile.component.js"></script>
	<script src="./components/footer-section.component.js"></script>
	<script src="./js/proposal-lineup.js"></script>
	<script src="./js/speaker-lineup.js"></script>
	<script src="./js/main.js"></script>

</body>
