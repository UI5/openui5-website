<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>UI5con Bengaluru in January 2026</title>
	<meta name="description"
		content="If you want to learn more about UI5, you can't miss UI5con Bengaluru 2026. A day of inspiration, learning, and networking with like-minded people. Inspiring talks. Endless learning. Frontend, Framework, SAPUI5, OpenUI5, UI5con, SAP" />
	<meta name="keywords"
		content="webstandards, web standards, html, css, JavaScript, Accessibility, Barrierefreiheit, WCAG, OpenUI5, DevOps, SAPUI5, UI5con, UI5 Web Components, Web Components, Webcomponents, Open Source" />
	<meta name="robots" content="index, follow" />
	<meta name="author" content="SAP SE" />
	<meta property="twitter:card" content="summary" />
	<meta property="twitter:url" content="https://openui5.org/ui5con/bengaluru2026/" />
	<meta property="twitter:title" content="UI5con Bengaluru 2026" />
	<meta property="twitter:description"
		content="If you want to learn more about UI5, you can't miss UI5con Bengaluru 2026. A day of inspiration, learning, and networking with like-minded people. Inspiring talks. Endless learning. December 2026" />
	<meta property="twitter:image" content="https://openui5.org/ui5con/bengaluru2026/images/share.png" />
	<meta property="og:title" content="UI5con Bengaluru in January 2026" />
	<meta property="og:description"
		content="If you want to learn more about UI5, you can't miss UI5con Bengaluru 2026. A day of inspiration, learning, and networking with like-minded people. Inspiring talks. Endless learning. December 2026" />
	<meta property="og:image" content="https://openui5.org/ui5con/bengaluru2026/images/share.png" />
	<meta name="theme-color" content="#e76500">

	<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
	<link rel="icon" type="image/svg+xml" href="images/icon.svg" />
	<link rel="icon" sizes="any" href="images/android-chrome-192x192.png" />

	<link rel="stylesheet" href="./css/common.css" />
	<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
	<link rel="stylesheet" href="./css/modules.css" />

	<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
</head>

<body>
	<nav class="nav" aria-label="Main navigation" id="nav">
		<nav-section v-if="!showMobileNav"></nav-section>
		<nav-section-mobile v-else></nav-section-mobile>
	</nav>

	<main id="main">
		<article>
		<section>
			<div class="wrap alternate section-bg-gradient" style="padding-bottom: 2px;">
				<!-- <div class="wrap "> -->
					<h2 class="section-heading section-blr-color2">
						<span>Agenda</span>
					</h2>
				</div>
			</section>
		<section id="agenda1" ref="agenda">
			<div class="wrap" style="padding-top: 2px;">
				<div class="box">
					<!-- <h2 class="section-heading section-blr-color2">
						<span> Agenda</span>
					</h2> -->

					<div class="agenda-sort">
						<div class="agenda-filter-container">
							<fieldset class="agenda-filter">
								<legend class="sr-only">Filter agenda</legend>
								<div class="agenda-filter__element"><input type="radio" @change="onFilterChange($event)" id="all" name="filter"
										value="all" checked="checked" data-enpassusermodified="yes"> <label for="all"
										class="agenda-filter__label">All</label></div>
								<div class="agenda-filter__element"><input type="radio" @change="onFilterChange($event)" id="audimax" name="filter"
										value="audimax" data-enpassusermodified="yes"> <label for="audimax"
										class="agenda-filter__label">Main Stage</label></div>
								<div class="agenda-filter__element"><input type="radio" @change="onFilterChange($event)" id="w1" name="filter" value="w1"
										data-enpassusermodified="yes"> <label for="w1" class="agenda-filter__label">Demo Pod 1</label>
								</div>
								<div class="agenda-filter__element"><input type="radio" @change="onFilterChange($event)" id="w3" name="filter" value="w3"
										data-enpassusermodified="yes"> <label for="w3" class="agenda-filter__label">Demo Pod 2</label>
								</div>
							</fieldset>
						</div>
					</div>

					<ol class="agenda">
						<li
							class="agenda-slot"
							:class="{
								w1: filter.toLowerCase() === 'w1' && (event.location.toLowerCase().includes('w1') || event.location.toLowerCase().includes('w2')),
								w3: filter.toLowerCase() === 'w3' && event.location.toLowerCase().includes('w3'),
								audimax: filter.toLowerCase() === 'audimax' &&  event.location.toLowerCase().includes('audimax')}"
								v-for="event in this.formattedLineup" :key="event.id" v-cloak>
							<div class="agenda-slot-header">
								<div>
									<p class="agenda-slot-details">
										<span class="agenda-time">
											{{event.startTime | trimTime}} {{event.endTime | trimTime}}
										</span>

										<span class="agenda-room">
											{{ event.location | formatLocation }}
										</span>
									</p>
								</div>
							</div>

							<div class="agenda-slot-container">
								<h1 class="agenda-slot-title">{{ event.title | decodeHtml}}
									<span class="agenda-level" v-if="event.proficiencyLevel"
										:class="{ beginner: event.proficiencyLevel === 'beginner', intermediate: event.proficiencyLevel === 'intermediate', advanced: event.proficiencyLevel === 'advanced' }"
									>
										{{ event.proficiencyLevel}}
									</span>
								</h1>

								<p class="agenda-slot-speakers" v-if="event.speakers.length > 0">
									<template v-for="(speaker, index) in event.speakers"
										:key="`${speaker.firstName} ${speaker.firstName}`">
										<span> {{speaker.firstName}} {{speaker.lastName}} (<span
												v-html="speaker.company"></span>)</span><span
											v-if="index != event.speakers.length - 1">, </span>
									</template>
								</p>

								<div class="agenda-slot-inner-container">
									<div class="agenda-slot-speakers-images" v-if="event.speakers.length > 0">
										<template v-for="speaker in event.speakers"
											:key="`${speaker.firstName} ${speaker.firstName}`">
											<button v-if="speaker.hasPhoto"
												:id="`btn-${speaker.firstName}-${speaker.lastName}-${event.id}`"
												@click="openSpeakerInfoModal(event.speakers, `btn-${speaker.firstName}-${speaker.lastName}-${event.id}`)">
												<img :src="`https://ui5conindia.cfapps.eu12.hana.ondemand.com${speaker.photoUrl}`"
													:alt="`Portrait of ${speaker.firstName} ${speaker.lastName}`" />
											</button>
											<button v-else
												:id="`btn-${speaker.firstName}-${speaker.lastName}-${event.id}`"
												@click="openSpeakerInfoModal(event.speakers, `btn-${speaker.firstName}-${speaker.lastName}-${event.id}`)">
												<span class="placeholder"></span>
											</button>

										</template>
									</div>

									<p class="agenda-slot-description">{{event.description | decodeHtml}}</p>
								</div>
								<template v-if="event.presentationLinks.length > 0">
									<template
										v-if="!(event.presentationLinks.length == 1 && event.presentationLinks[0].linkType.toLowerCase() == 'feedback')">
										<ul class="agenda-slot-links">
											<template v-for="link in event.presentationLinks" :key="link.linkType">
												<li v-if="link.linkType.toLowerCase() !== 'feedback'">
													<a :href="link.url" class="agenda-slot-linkitem" target="_blank"
														hreflang="en" rel="noopener noreferrer">{{link.linkType}}</a>
												</li>
											</template>
										</ul>
									</template>
								</template>
							</div>
						</li>
					</ol>
				</div>
				<div id="speaker-modal" ref="speakerModal" aria-hidden="true" tabindex="-1" aria-modal="true"
					class="agenda-modal-backdrop" style="display: none" @keydown.esc="closeSpeakerInfoModal"
					@click.self="closeSpeakerInfoModal" v-cloak>
					<div class="agenda-modal" role="document" aria-labelledby="speaker-dialog-title"
						aria-describedby="speaker-dialog-description" tabindex="-1" ref="speakerModalContent">
						<h2 class="sr-only" id="speaker-dialog-title">
							Detailed Info about
							<template v-for="speaker in activeSpeakers"
								:key="`${speaker.firstName} ${speaker.firstName}`">
								{{speaker.firstName}} {{speaker.lastName}}
							</template>
						</h2>

						<p class="sr-only" id="speaker-dialog-description">
							<template v-for="speaker in activeSpeakers"
								:key="`${speaker.firstName} ${speaker.firstName}`">
								Speaker's name: {{speaker.firstName}} {{speaker.lastName}}
								<span v-if="speaker.company">Speaker's company: {{speaker.company}}</span>
								Speaker's bio: {{speaker.bio}}
							</template>
						</p>

						<button aria-label="Close Dialog" @click="closeSpeakerInfoModal" ref="close"
							v-on:keydown.tab.prevent="focusTrapModal($event)">
							✕
						</button>

						<div v-for="(speaker, index) in activeSpeakers" class="agenda-modal-content-container"
							:key="index">
							<figure>
								<img
									v-if="speaker.hasPhoto"
									:src="`https://ui5conindia.cfapps.eu12.hana.ondemand.com${speaker.photoUrl}`"
									:alt="`Portrait of ${speaker.firstName} ${speaker.lastName}`" />

								<div
									v-else
									class="placeholder"
								></div>
							</figure>
							<article>
								<header>
									<div>
										<h3 class="">
											{{speaker.firstName}} {{speaker.lastName}}
										</h3>
										<p v-if="speaker.company" v-html="speaker.company"></p>
									</div>
								</header>
								<p class="" v-if="speaker.bio" v-html="decodeBioHtml(speaker.bio)"></p>
								
							</article>
						</div>
					</div>
				</div>
			</div>
		</section>
		</article>
	</main>

	<footer id="footer">
		<footer-section></footer-section>
	</footer>
	
	<script src="./components/nav-section.component.js"></script>
	<script src="./components/nav-section-mobile.component.js"></script>
	<script src="./components/footer-section.component.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
	<script src="./js/speaker-lineup.js"></script>
	<script src="./js/proposal-lineup.js"></script>
	<script src="./js/main.js"></script>

</body>

</html>
