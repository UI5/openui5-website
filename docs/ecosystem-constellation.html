<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenUI5 Ecosystem — Constellation Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #faf8f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    /* ── Page context wrapper ── */
    .page-context {
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 32px 100px;
    }

    /* ── Section header ── */
    .section-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8a030;
      margin-bottom: 12px;
    }

    .section-heading {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 700;
      line-height: 1.15;
      color: #0d1b2a;
      margin-bottom: 16px;
    }

    .section-subhead {
      font-size: 18px;
      font-weight: 400;
      color: #4a5568;
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 56px;
    }

    /* ── Constellation canvas ── */
    .constellation-wrap {
      background: #0d1b2a;
      border-radius: 20px;
      position: relative;
      overflow: visible;
      padding: 0;
      /* subtle inner glow */
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 80px rgba(13, 27, 42, 0.4);
    }

    .constellation-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Stars ── */
    .star {
      cursor: pointer;
      outline: none;
    }

    .star circle.core {
      fill: #e8e0d0;
      transition: r 0.2s ease, fill 0.2s ease;
    }

    .star circle.glow {
      fill: rgba(232, 224, 208, 0.12);
      transition: r 0.2s ease, fill 0.2s ease;
    }

    .star:hover circle.core,
    .star:focus circle.core {
      fill: #f9c55a;
    }

    .star:hover circle.glow,
    .star:focus circle.glow {
      fill: rgba(249, 197, 90, 0.22);
    }

    /* ── Constellation lines ── */
    .constellation-line {
      stroke: rgba(232, 224, 208, 0.18);
      stroke-width: 1;
      fill: none;
    }

    /* ── Group labels ── */
    .group-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      fill: rgba(232, 224, 208, 0.35);
    }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed;
      z-index: 100;
      background: #162336;
      border: 1px solid rgba(232, 224, 208, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      width: 240px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #tooltip .tt-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #e8a030;
      margin-bottom: 5px;
    }

    #tooltip .tt-name {
      font-size: 15px;
      font-weight: 600;
      color: #f0ece4;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    #tooltip .tt-desc {
      font-size: 13px;
      color: rgba(240, 236, 228, 0.7);
      line-height: 1.5;
      margin-bottom: 10px;
    }

    #tooltip .tt-link {
      font-size: 12px;
      font-weight: 500;
      color: #e8a030;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #tooltip .tt-link::after {
      content: '↗';
      font-size: 11px;
    }

    /* ── CTA ── */
    .section-cta {
      margin-top: 36px;
      text-align: center;
    }

    .section-cta a {
      font-size: 16px;
      font-weight: 600;
      color: #e8a030;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s ease;
    }

    .section-cta a:hover {
      gap: 10px;
    }

    .section-cta a::after {
      content: '→';
    }

    /* ── Twinkling animation (subtle) ── */
    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .twinkle-1 { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-2 { animation: twinkle 4.1s ease-in-out infinite 0.8s; }
    .twinkle-3 { animation: twinkle 2.7s ease-in-out infinite 1.4s; }
    .twinkle-4 { animation: twinkle 5.0s ease-in-out infinite 0.3s; }
    .twinkle-5 { animation: twinkle 3.6s ease-in-out infinite 2.1s; }

    /* ── Background ambient stars ── */
    .bg-star {
      fill: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

<div class="page-context">

  <p class="section-eyebrow">Ecosystem</p>
  <h2 class="section-heading">Built around OpenUI5</h2>
  <p class="section-subhead">A growing constellation of official tools and community projects — everything you need from day one.</p>

  <div class="constellation-wrap">
    <!--
      SVG viewBox: 0 0 1000 480
      Official constellation: left/center cluster (Pleiades-style, tighter)
        CLI           (180, 160)  large
        WebComponents (280, 120)  large
        Inspector     (340, 200)  medium
        Linter        (240, 240)  medium
        TypeScript    (150, 260)  medium
        MCP Server    (310, 300)  small
      Community constellation: right, looser triangle (Orion-style)
        easy-ui5      (640, 130)  large
        wdi5          (760, 220)  medium
        bestofui5     (700, 320)  small
    -->
    <svg
      class="constellation-svg"
      viewBox="0 0 1000 480"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="OpenUI5 ecosystem tools shown as a constellation map"
    >
      <!-- ── Ambient background stars ── -->
      <circle class="bg-star twinkle-3" cx="60"  cy="40"  r="1"/>
      <circle class="bg-star twinkle-1" cx="420" cy="30"  r="1.5"/>
      <circle class="bg-star twinkle-5" cx="550" cy="80"  r="1"/>
      <circle class="bg-star twinkle-2" cx="810" cy="50"  r="1"/>
      <circle class="bg-star twinkle-4" cx="920" cy="140" r="1.5"/>
      <circle class="bg-star twinkle-1" cx="480" cy="380" r="1"/>
      <circle class="bg-star twinkle-3" cx="100" cy="410" r="1.5"/>
      <circle class="bg-star twinkle-2" cx="880" cy="400" r="1"/>
      <circle class="bg-star twinkle-5" cx="960" cy="300" r="1"/>
      <circle class="bg-star twinkle-4" cx="30"  cy="300" r="1"/>
      <circle class="bg-star twinkle-1" cx="500" cy="200" r="0.8"/>
      <circle class="bg-star twinkle-2" cx="580" cy="310" r="1"/>
      <circle class="bg-star twinkle-3" cx="460" cy="140" r="0.8"/>

      <!-- ── Official constellation lines ── -->
      <!-- CLI ↔ WebComponents -->
      <line class="constellation-line" x1="180" y1="160" x2="280" y2="120"/>
      <!-- WebComponents ↔ Inspector -->
      <line class="constellation-line" x1="280" y1="120" x2="340" y2="200"/>
      <!-- Inspector ↔ Linter -->
      <line class="constellation-line" x1="340" y1="200" x2="240" y2="240"/>
      <!-- Linter ↔ TypeScript -->
      <line class="constellation-line" x1="240" y1="240" x2="150" y2="260"/>
      <!-- TypeScript ↔ CLI -->
      <line class="constellation-line" x1="150" y1="260" x2="180" y2="160"/>
      <!-- Inspector ↔ MCP Server -->
      <line class="constellation-line" x1="340" y1="200" x2="310" y2="300"/>
      <!-- Linter ↔ MCP Server -->
      <line class="constellation-line" x1="240" y1="240" x2="310" y2="300"/>

      <!-- ── Community constellation lines ── -->
      <!-- easy-ui5 ↔ wdi5 -->
      <line class="constellation-line" x1="640" y1="130" x2="760" y2="220"/>
      <!-- wdi5 ↔ bestofui5 -->
      <line class="constellation-line" x1="760" y1="220" x2="700" y2="320"/>
      <!-- bestofui5 ↔ easy-ui5 -->
      <line class="constellation-line" x1="700" y1="320" x2="640" y2="130"/>

      <!-- (divider removed) -->

      <!-- ── Group labels ── -->
      <text class="group-label" x="170" y="380">Official Tools</text>
      <text class="group-label" x="620" y="390">Community Projects</text>

      <!-- ═══════════════════════════════════════ -->
      <!-- OFFICIAL STARS -->
      <!-- ═══════════════════════════════════════ -->

      <!-- CLI (large) -->
      <g class="star twinkle-1"
         tabindex="0" role="button"
         data-name="UI5 CLI"
         data-label="Official Tool"
         data-desc="Build and serve any UI5 project from the command line — the primary development toolchain."
         data-link="https://github.com/UI5/cli">
        <circle class="glow" cx="180" cy="160" r="22"/>
        <circle class="core" cx="180" cy="160" r="10"/>
      </g>

      <!-- UI5 Web Components (large) -->
      <g class="star twinkle-2"
         tabindex="0" role="button"
         data-name="UI5 Web Components"
         data-label="Official Tool"
         data-desc="Framework-agnostic SAP Fiori components built on web standards — usable with React, Vue, Angular or plain HTML."
         data-link="https://github.com/UI5/webcomponents">
        <circle class="glow" cx="280" cy="120" r="22"/>
        <circle class="core" cx="280" cy="120" r="10"/>
      </g>

      <!-- Inspector (medium) -->
      <g class="star twinkle-3"
         tabindex="0" role="button"
         data-name="UI5 Inspector"
         data-label="Official Tool"
         data-desc="Browser DevTools extension for debugging and inspecting OpenUI5/SAPUI5 applications."
         data-link="https://github.com/UI5/inspector">
        <circle class="glow" cx="340" cy="200" r="17"/>
        <circle class="core" cx="340" cy="200" r="7"/>
      </g>

      <!-- Linter (medium) -->
      <g class="star twinkle-4"
         tabindex="0" role="button"
         data-name="UI5 Linter"
         data-label="Official Tool"
         data-desc="Static analysis for UI5 apps — catch UI5-specific errors and deprecated API usage before they ship."
         data-link="https://github.com/UI5/linter">
        <circle class="glow" cx="240" cy="240" r="17"/>
        <circle class="core" cx="240" cy="240" r="7"/>
      </g>

      <!-- TypeScript Support (medium) -->
      <g class="star twinkle-5"
         tabindex="0" role="button"
         data-name="TypeScript Support"
         data-label="Official Tool"
         data-desc="Official type definitions and tooling to develop OpenUI5 apps in TypeScript."
         data-link="https://github.com/UI5/typescript">
        <circle class="glow" cx="150" cy="260" r="17"/>
        <circle class="core" cx="150" cy="260" r="7"/>
      </g>

      <!-- MCP Server (small) -->
      <g class="star twinkle-1"
         tabindex="0" role="button"
         data-name="UI5 MCP Server"
         data-label="Official Tool"
         data-desc="Gives AI coding agents structured knowledge of the OpenUI5 framework to generate better UI5 code."
         data-link="https://github.com/UI5/mcp-server">
        <circle class="glow" cx="310" cy="300" r="13"/>
        <circle class="core" cx="310" cy="300" r="5"/>
      </g>

      <!-- ═══════════════════════════════════════ -->
      <!-- COMMUNITY STARS -->
      <!-- ═══════════════════════════════════════ -->

      <!-- easy-ui5 (large) -->
      <g class="star twinkle-3"
         tabindex="0" role="button"
         data-name="Easy UI5 Generator"
         data-label="Community Project"
         data-desc="The standard way to scaffold a new UI5 project — apps, libraries, FLP plugins and more with a single command."
         data-link="https://github.com/UI5-community/generator-easy-ui5">
        <circle class="glow" cx="640" cy="130" r="22"/>
        <circle class="core" cx="640" cy="130" r="10"/>
      </g>

      <!-- wdi5 (medium) -->
      <g class="star twinkle-2"
         tabindex="0" role="button"
         data-name="wdi5"
         data-label="Community Project"
         data-desc="End-to-end test framework for UI5 apps, built on WebdriverIO. The community standard — no official alternative exists."
         data-link="https://github.com/UI5-community/wdi5">
        <circle class="glow" cx="760" cy="220" r="17"/>
        <circle class="core" cx="760" cy="220" r="7"/>
      </g>

      <!-- Best of UI5 (small) -->
      <g class="star twinkle-5"
         tabindex="0" role="button"
         data-name="Best of UI5"
         data-label="Community Project"
         data-desc="Community-curated index of UI5 tools, libraries and controls — the discovery hub for the UI5 package ecosystem."
         data-link="https://bestofui5.com">
        <circle class="glow" cx="700" cy="320" r="13"/>
        <circle class="core" cx="700" cy="320" r="5"/>
      </g>

    </svg>
  </div><!-- /constellation-wrap -->

  <div class="section-cta">
    <a href="https://bestofui5.com" target="_blank" rel="noopener">Discover more at bestofui5.com</a>
  </div>

</div><!-- /page-context -->

<!-- ── Tooltip element ── -->
<div id="tooltip" role="tooltip" aria-live="polite">
  <div class="tt-label" id="tt-label"></div>
  <div class="tt-name"  id="tt-name"></div>
  <div class="tt-desc"  id="tt-desc"></div>
  <a  class="tt-link"  id="tt-link" href="#" target="_blank" rel="noopener">View on GitHub</a>
</div>

<script>
  const tooltip  = document.getElementById('tooltip');
  const ttLabel  = document.getElementById('tt-label');
  const ttName   = document.getElementById('tt-name');
  const ttDesc   = document.getElementById('tt-desc');
  const ttLink   = document.getElementById('tt-link');

  let activeTarget = null;

  function showTooltip(el, x, y) {
    ttLabel.textContent = el.dataset.label;
    ttName.textContent  = el.dataset.name;
    ttDesc.textContent  = el.dataset.desc;
    ttLink.href         = el.dataset.link;
    ttLink.textContent  = el.dataset.link.includes('bestofui5') ? 'Visit bestofui5.com' : 'View on GitHub';
    ttLink.className    = 'tt-link';

    tooltip.classList.add('visible');
    positionTooltip(x, y);
  }

  function positionTooltip(x, y) {
    const tw = 240 + 32; // tooltip width + margin
    const th = 160;      // estimated height
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let left = x + 18;
    let top  = y - 20;

    if (left + tw > vw) left = x - tw + 18;
    if (top + th > vh)  top  = y - th - 10;
    if (top < 8)        top  = 8;

    tooltip.style.left = left + 'px';
    tooltip.style.top  = top  + 'px';
  }

  function hideTooltip() {
    tooltip.classList.remove('visible');
    activeTarget = null;
  }

  // ── Mouse events ──
  document.querySelectorAll('.star').forEach(star => {
    star.addEventListener('mouseenter', e => {
      activeTarget = star;
      showTooltip(star, e.clientX, e.clientY);
    });

    star.addEventListener('mousemove', e => {
      if (activeTarget === star) positionTooltip(e.clientX, e.clientY);
    });

    star.addEventListener('mouseleave', () => {
      hideTooltip();
    });

    // ── Keyboard events ──
    star.addEventListener('focus', e => {
      const rect = star.querySelector('circle.core').getBoundingClientRect();
      activeTarget = star;
      showTooltip(star, rect.right, rect.top);
    });

    star.addEventListener('blur', () => {
      hideTooltip();
    });

    star.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        window.open(star.dataset.link, '_blank', 'noopener');
      }
      if (e.key === 'Escape') hideTooltip();
    });

    // ── Touch events ──
    star.addEventListener('touchstart', e => {
      e.preventDefault();
      if (activeTarget === star) {
        hideTooltip();
        return;
      }
      const touch = e.touches[0];
      activeTarget = star;
      showTooltip(star, touch.clientX, touch.clientY);
    }, { passive: false });
  });

  // Dismiss on outside tap
  document.addEventListener('touchstart', e => {
    if (!e.target.closest('.star') && !e.target.closest('#tooltip')) {
      hideTooltip();
    }
  });
</script>

</body>
</html>
